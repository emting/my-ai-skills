openapi: 3.1.0
info:
  title: Personal AI Skills API
  version: 1.0.0
  description: API definitions for personal AI skills.
servers:
  - url: https://api.example.com
    description: Production server
paths:
  /weather/current:
    get:
      operationId: getCurrentWeather
      summary: Get current weather by city
      description: Returns current weather information for a given city.
      parameters:
        - name: city
          in: query
          required: true
          description: City name, for example Taipei.
          schema:
            type: string
        - name: units
          in: query
          required: false
          description: Unit system.
          schema:
            type: string
            enum:
              - metric
              - imperial
            default: metric
      responses:
        "200":
          description: Weather result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  city:
                    type: string
                  temperature:
                    type: number
                  condition:
                    type: string
                  humidity:
                    type: number
        "400":
          description: Invalid request.
        "401":
          description: Unauthorized.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - ApiKeyAuth: []
